[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-optimizer"
version = "0.1.0"
description = "LLM Inference Optimization Engine: benchmarking, profiling, and config recommendation for open-weight model serving"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "quantaai007" }]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "psutil>=6.0,<7.0",
    "structlog>=24.1,<25.0",
    "typer>=0.12,<0.13",
    "click>=8.1,<8.2",  # typer 0.12.x breaks on click>=8.2's stricter flag validation
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# CPU-capable local backend. On Windows/macOS without a C/C++ toolchain, install
# the prebuilt wheel instead of the default PyPI sdist:
#   pip install llama-cpp-python --prefer-binary \
#     --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
serving = [
    # Pinned exact: the prebuilt CPU wheel for llama-cpp-python>=0.3.3 (through at
    # least 0.3.38) crashes on this machine with OSError WinError -1073741795
    # (STATUS_ILLEGAL_INSTRUCTION) inside llama_backend_init() -- found by actually
    # running the real server this session. 0.3.2's wheel runs cleanly; re-verify
    # before bumping this pin.
    "llama-cpp-python==0.3.2",
    "uvicorn>=0.23,<1.0",
    "fastapi>=0.100,<1.0",
    "sse-starlette>=1.6.1,<3.0",
    "starlette-context>=0.3.6,<0.4",
]

# Only install on a Linux host with a working NVIDIA driver + CUDA toolkit.
# vllm has no official native Windows build (see VLLMBackend._check_hardware_support);
# hardware-info reports whether this extra is actually usable before you rely on it.
gpu = [
    "nvidia-ml-py>=12.560,<13.0",
    "torch>=2.3,<2.5",
    "vllm>=0.5,<0.7",
]

# Real per-model token counts for the benchmark client (HFTokenizerCounter). Optional:
# without it, HFTokenizerCounter degrades to method="unavailable" rather than crashing,
# and FixedTokenCounter/WhitespaceApproxCounter work with no extra install at all.
benchmark = [
    "tokenizers>=0.19,<1.0",
]

# Distribution plots (TTFT/latency/throughput) for the Day 7 report generator.
report = [
    "matplotlib>=3.8,<4.0",
]

dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-asyncio>=0.23,<0.25",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0,<7.0",
    # fastapi itself (not uvicorn/llama-cpp-python) so the API test suite runs without
    # the `serving` extra -- TestClient only needs fastapi + httpx (already a core dep).
    "fastapi>=0.100,<1.0",
]

dashboard = [
    "streamlit>=1.36,<2.0",
    "plotly>=5.22,<6.0",
]

[project.scripts]
inference-optimizer = "inference_optimizer.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["real_backend: requires a real model/server; skipped unless RUN_REAL_BACKEND_TESTS=1"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["inference_optimizer"]
ignore_missing_imports = true
